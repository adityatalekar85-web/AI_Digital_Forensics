<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="45%" stop-color="#edf6f5"/>
      <stop offset="100%" stop-color="#d7ebe8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102032"/>
      <stop offset="100%" stop-color="#20394c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b88a3d"/>
      <stop offset="100%" stop-color="#f4d28a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#102032" flood-opacity="0.20"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="160" r="320" fill="#cbe7e2" opacity="0.55"/>
  <circle cx="150" cy="850" r="260" fill="#ead7b6" opacity="0.50"/>
  <path d="M0 820 C320 700 520 920 820 750 C1050 620 1340 660 1800 520 V1000 H0Z" fill="#ffffff" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="880" y="160" width="650" height="520" rx="28" fill="#ffffff" opacity="0.92"/>
    <rect x="930" y="210" width="550" height="420" rx="22" fill="url(#navy)"/>
    <rect x="970" y="250" width="470" height="80" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect x="970" y="360" width="220" height="220" rx="18" fill="#ffffff" opacity="0.08"/>
    <rect x="1220" y="360" width="220" height="220" rx="18" fill="#ffffff" opacity="0.08"/>
  </g>

  <g filter="url(#glow)" opacity="0.94">
    <circle cx="1080" cy="470" r="90" fill="none" stroke="#65d2ca" stroke-width="2"/>
    <circle cx="1080" cy="470" r="46" fill="none" stroke="#f4d28a" stroke-width="3"/>
    <path d="M1080 380 L1158 425 V515 L1080 560 L1002 515 V425Z" fill="none" stroke="#65d2ca" stroke-width="2"/>
    <path d="M1300 402 L1390 470 L1300 538 L1210 470Z" fill="none" stroke="#f4d28a" stroke-width="3"/>
    <path d="M1170 470 H1210 M1390 470 H1450 M1080 380 V320 M1080 560 V620" stroke="#65d2ca" stroke-width="2"/>
    <circle cx="1170" cy="470" r="6" fill="#f4d28a"/>
    <circle cx="1210" cy="470" r="6" fill="#65d2ca"/>
    <circle cx="1450" cy="470" r="6" fill="#f4d28a"/>
    <circle cx="1080" cy="320" r="6" fill="#65d2ca"/>
    <circle cx="1080" cy="620" r="6" fill="#f4d28a"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="210" width="470" height="360" rx="28" fill="#ffffff" opacity="0.88"/>
    <rect x="310" y="275" width="230" height="14" rx="7" fill="url(#gold)"/>
    <rect x="310" y="325" width="340" height="12" rx="6" fill="#102032" opacity="0.26"/>
    <rect x="310" y="355" width="280" height="12" rx="6" fill="#102032" opacity="0.18"/>
    <rect x="310" y="410" width="110" height="110" rx="20" fill="#e7f3f1"/>
    <rect x="450" y="410" width="110" height="110" rx="20" fill="#f0e2c7"/>
    <rect x="590" y="410" width="80" height="110" rx="20" fill="#d5eae6"/>
